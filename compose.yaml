services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: relayroom
      POSTGRES_USER: relayroom
      POSTGRES_PASSWORD: relayroom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayroom -d relayroom"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_migrated_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://relayroom:relayroom@postgres:5432/relayroom
      REDIS_HOST: redis
      DESTINATION_URL: http://api:8000/simulator/crm
    ports:
      - "8020:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://relayroom:relayroom@postgres:5432/relayroom
      REDIS_HOST: redis
      DESTINATION_URL: http://api:8000/simulator/crm
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_migrated_data:
  redis_data:
